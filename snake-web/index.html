<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Snake Game - Retro Arcade Klassiker im Browser. Neon-Ästhetik, Touch-Steuerung, Highscores.">
    <title>Snake - Retro Arcade Edition</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
</head>
<body>
    <div id="game-container">
        <h1 class="game-title">SNAKE</h1>
        <p class="game-subtitle">RETRO ARCADE EDITION</p>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="info-bar">
            <span>
                <span class="status-dot" id="sound-status"></span>
                TON [M]
            </span>
            <span>
                <span class="status-dot" id="grid-status"></span>
                GITTER [G]
            </span>
            <span>
                <span class="status-dot" id="wrap-status"></span>
                WRAP [V]
            </span>
            <span>
                <span class="status-dot" id="crt-status"></span>
                CRT [C]
            </span>
        </div>

        <!-- Mobile D-Pad -->
        <div class="dpad-container">
            <div class="dpad-btn" id="dpad-up">▲</div>
            <div class="dpad-btn" id="dpad-down">▼</div>
            <div class="dpad-btn" id="dpad-left">◄</div>
            <div class="dpad-btn" id="dpad-right">►</div>
            <div class="dpad-btn" id="dpad-center">II</div>
        </div>

        <div class="game-footer">
            DESIGNED BY OLIVER &middot; WEB VERSION 2.0<br>
            PFEILTASTEN/WASD BEWEGEN &middot; P/ESC PAUSE &middot; SWIPE AUF MOBIL
        </div>
    </div>

    <!-- JavaScript Module (Reihenfolge wichtig wegen Abhängigkeiten) -->
    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/snake.js"></script>
    <script src="js/food.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>

    <!-- Status-Indikatoren aktualisieren -->
    <script>
        // Status-Dots für Toggle-Optionen aktualisieren
        setInterval(() => {
            if (typeof Game === 'undefined') return;
            const dots = {
                'sound-status': Audio.enabled,
                'grid-status': Game.showGrid,
                'wrap-status': Game.wrapAround,
                'crt-status': Game.showCRT,
            };
            for (const [id, active] of Object.entries(dots)) {
                const el = document.getElementById(id);
                if (el) {
                    el.className = 'status-dot ' + (active ? 'on' : 'off');
                }
            }
        }, 200);
    </script>
</body>
</html>
