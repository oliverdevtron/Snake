<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Snake - Retro Arcade Web Edition. Klassisches Snake-Spiel mit modernem Neon-Design.">
    <meta name="theme-color" content="#0a0a0a">
    <title>Snake - Retro Arcade Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-wrapper">
        <header id="game-header">
            <h1 class="header-title">SNAKE</h1>
            <div class="header-controls">
                <button id="btn-sound" class="icon-btn" title="Sound (M)">
                    <span id="sound-icon">🔊</span>
                </button>
                <button id="btn-crt" class="icon-btn" title="CRT-Effekt (C)">
                    <span>📺</span>
                </button>
                <button id="btn-grid" class="icon-btn" title="Gitter (G)">
                    <span>⊞</span>
                </button>
            </div>
        </header>

        <main id="game-container">
            <canvas id="gameCanvas"></canvas>
        </main>

        <!-- Mobile D-Pad -->
        <div id="dpad-container" class="dpad">
            <button id="dpad-up" class="dpad-btn dpad-up" aria-label="Oben">▲</button>
            <div class="dpad-row">
                <button id="dpad-left" class="dpad-btn dpad-left" aria-label="Links">◄</button>
                <div class="dpad-center"></div>
                <button id="dpad-right" class="dpad-btn dpad-right" aria-label="Rechts">►</button>
            </div>
            <button id="dpad-down" class="dpad-btn dpad-down" aria-label="Unten">▼</button>
        </div>

        <footer id="game-footer">
            <span class="footer-text">Designed by Oliver | Web Edition mit KI</span>
        </footer>
    </div>

    <!-- Scripts in Reihenfolge: Config → Module → Game -->
    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/input.js"></script>
    <script src="js/snake.js"></script>
    <script src="js/food.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
